<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Koçluk Platformu</title>
    <meta name="description" content="Öğrenci koçluğu: görev takibi, ders planı, sınav analizi ve veli iletişimi." />

    <!-- Favicon: önceki /vite.svg mevcut değildi (public/ içinde favicon.svg var),
         yani simge tarayıcıda kırık geliyordu. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- PWA: TWA kabuğunun kurulabilirlik şartı bu manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Android'de durum çubuğunun rengi; manifest'teki theme_color ile aynı -->
    <meta name="theme-color" content="#0F6E56" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Koçluk" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
